name: Movie Review Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    env:
      PYTHONUNBUFFERED: 1  
      SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN }} 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi requests playwright playwright-stealth

      - name: Install Playwright Chromium Browser
        run: |
          playwright install chromium

      - name: Step 1 - Run Finder (Download & Extract Raw Titles)
        run: python finder.py

      - name: Step 2 - Run Cleaner (Apply Deterministic Rules)
        run: python cleaner.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output.json logs.txt
          git diff --staged --quiet || git commit -m "Auto-update movie review results and logs [skip ci]"
          git pull --rebase origin main
          git push
